<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | نظام شؤون الموظفين</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f6f7f9,#fff0f2);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;color:#212936}.box{width:min(420px,calc(100% - 30px));background:white;border:1px solid #e8edf1;border-radius:16px;padding:30px;box-shadow:0 18px 55px #26344912}.brand{text-align:center;margin-bottom:23px}.logo{width:54px;height:54px;border:2px solid #c8102e;border-radius:50%;color:#c8102e;display:grid;place-items:center;font-size:29px;font-weight:700;margin:0 auto 12px}.brand b{display:block;font-size:16px}.brand small{color:#778191}.box h1{font-size:20px;margin:0 0 5px}.intro{margin:0 0 20px;color:#778191;font-size:12px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;margin-bottom:6px}.field input{height:43px;width:100%;padding:0 12px;border:1px solid #e1e6eb;border-radius:9px;font:14px inherit;outline:none}.field input:focus{border-color:#ce687a;box-shadow:0 0 0 3px #c8102e12}.submit{width:100%;height:43px;border:0;border-radius:9px;background:#c8102e;color:white;font:600 14px inherit;cursor:pointer;margin-top:5px}.error{display:none;padding:9px 11px;background:#fff0f1;border-radius:8px;color:#a72237;font-size:12px;margin:0 0 12px}.foot{text-align:center;font-size:10px;color:#9aa2ad;margin-top:20px}</style></head>
<body><main class="box"><div class="brand"><div class="logo">✚</div><b>الهلال الأحمر الفلسطيني</b><small>نظام إدارة شؤون الموظفين</small></div><h1 id="heading">تسجيل الدخول</h1><p class="intro" id="intro">أدخل اسم المستخدم وكلمة المرور.</p><div class="error" id="error"></div><form id="form"><div class="field"><label for="username">اسم المستخدم</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="80" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" required></div><div class="field" id="confirmWrap" style="display:none"><label for="confirm_password">تأكيد كلمة المرور</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12"></div><button class="submit" id="submit">دخول</button></form><div class="foot">الهلال الأحمر الفلسطيني © 2026</div></main>
<script>
const form=document.getElementById("form"),err=document.getElementById("error"),btn=document.getElementById("submit");
let setupRequired=false;
function showError(message){err.textContent=message;err.style.display="block"}
async function initialize(){try{const r=await fetch("/api/setup-status");const s=await r.json();setupRequired=s.setup_required;if(setupRequired){document.getElementById("heading").textContent="إنشاء حساب المدير";document.getElementById("intro").textContent="أنشئ حساب المدير الأول. يمكن إنشاء حساب واحد فقط.";document.getElementById("confirmWrap").style.display="block";form.password.autocomplete="new-password";btn.textContent="إنشاء الحساب"}}catch(e){showError("تعذر الاتصال بالنظام. حاول تحديث الصفحة.")}}
form.onsubmit=async e=>{e.preventDefault();err.style.display="none";btn.disabled=true;btn.textContent=setupRequired?"جارٍ إنشاء الحساب...":"جارٍ التحقق...";try{const payload={username:form.username.value,password:form.password.value};if(setupRequired)payload.confirm_password=form.confirm_password.value;const r=await fetch(setupRequired?"/api/setup-admin":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||"تعذر تنفيذ الطلب.");location.href="/"}catch(e){showError(e.message)}finally{btn.disabled=false;btn.textContent=setupRequired?"إنشاء الحساب":"دخول"}};
fetch("/api/session").then(r=>r.json()).then(s=>{if(s.authenticated)location.href="/"});initialize();
</script></body></html>
